name: ci
on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: jsdom install
        run: npm install jsdom --no-audit --no-fund
      - name: 66 automated checks
        run: cd web && NODE_PATH=$PWD/../node_modules node smoke_test.js
      - name: eval harness (33 messages)
        run: NODE_PATH=$PWD/node_modules node eval/run_eval.js
      - name: rules JSON valid
        run: |
          python3 - <<'PY'
          import json, glob
          for f in glob.glob('rules/*.json'): json.load(open(f)); print('ok', f)
          PY
