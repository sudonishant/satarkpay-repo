<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background:#070b14; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="grid-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="layer1-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="layer2-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="layer3-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Glow filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes pulseFlow {
        0% { stroke-dashoffset: 60; opacity: 0.2; }
        50% { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0.2; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes floatSlow3 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes spinOrbital {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes radarSweep {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .flow-stream {
        stroke-dasharray: 8 6;
        animation: pulseFlow 1.8s linear infinite;
      }
      .iso-layer-top {
        animation: floatSlow 4s ease-in-out infinite;
      }
      .iso-layer-mid {
        animation: floatSlow2 3.6s ease-in-out infinite 0.5s;
      }
      .iso-layer-bot {
        animation: floatSlow3 4.2s ease-in-out infinite 1s;
      }
    </style>
  </defs>

  <!-- Background Cyber Mesh -->
  <rect x="0" y="0" width="960" height="480" fill="#070b14"/>
  <g opacity="0.35">
    <path d="M 0 100 L 960 100 M 0 200 L 960 200 M 0 300 L 960 300 M 0 400 L 960 400" stroke="#0e7490" stroke-width="0.5"/>
    <path d="M 160 0 L 160 480 M 320 0 L 320 480 M 480 0 L 480 480 M 640 0 L 640 480 M 800 0 L 800 480" stroke="#0e7490" stroke-width="0.5"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="480" y="38" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="800" letter-spacing="2">3D ISOMETRIC THREAT INTERCEPTION PIPELINE</text>
  <text x="480" y="58" text-anchor="middle" fill="#06b6d4" font-size="11" font-weight="600" letter-spacing="1">ZERO-TRUST LAYERED ARCHITECTURE • SEBI × NSDL SANGYAN</text>

  <!-- 3D DATA FLOW CONNECTIONS (Isometric drop lines) -->
  <g class="flow-stream" stroke="#ef4444" stroke-width="2" opacity="0.6">
    <line x1="280" y1="140" x2="280" y2="240"/>
    <line x1="480" y1="150" x2="480" y2="230"/>
    <line x1="680" y1="140" x2="680" y2="240"/>
  </g>
  <g class="flow-stream" stroke="#10b981" stroke-width="2" opacity="0.8">
    <line x1="280" y1="280" x2="280" y2="380"/>
    <line x1="480" y1="290" x2="480" y2="370"/>
    <line x1="680" y1="280" x2="680" y2="380"/>
  </g>

  <!-- ========================================== -->
  <!-- LAYER 1: INCOMING ATTACK SURFACE (TOP ISOMETRIC SLAB) -->
  <!-- ========================================== -->
  <g class="iso-layer-top">
    <!-- Isometric Slab Base -->
    <path d="M 480 80 L 820 135 L 480 190 L 140 135 Z" fill="url(#layer1-grad)" stroke="#f43f5e" stroke-width="1.8" filter="url(#glow-red)"/>
    <!-- Slab Extrusion Thickness -->
    <path d="M 140 135 L 140 145 L 480 200 L 480 190 Z" fill="#9f1239" opacity="0.6"/>
    <path d="M 480 190 L 480 200 L 820 145 L 820 135 Z" fill="#881337" opacity="0.8"/>

    <!-- Layer 1 Content -->
    <g transform="translate(0, 0)">
      <!-- Left Node: WhatsApp / Telegram -->
      <g transform="translate(260, 130)">
        <ellipse cx="0" cy="0" rx="35" ry="18" fill="#1e293b" stroke="#f43f5e" stroke-width="1.2"/>
        <text x="0" y="-3" text-anchor="middle" fill="#fda4af" font-size="10" font-weight="700">📱 SOCIAL</text>
        <text x="0" y="9" text-anchor="middle" fill="#94a3b8" font-size="8">WA / Telegram</text>
      </g>

      <!-- Center Node: Digital Arrest / Fake Police -->
      <g transform="translate(480, 135)">
        <ellipse cx="0" cy="0" rx="42" ry="22" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
        <text x="0" y="-3" text-anchor="middle" fill="#ff4d4d" font-size="10" font-weight="800">🚨 THREAT VECTORS</text>
        <text x="0" y="10" text-anchor="middle" fill="#cbd5e1" font-size="8.5">Digital Arrest • Stock Tips</text>
      </g>

      <!-- Right Node: Fake APK / QR Scams -->
      <g transform="translate(700, 130)">
        <ellipse cx="0" cy="0" rx="35" ry="18" fill="#1e293b" stroke="#f43f5e" stroke-width="1.2"/>
        <text x="0" y="-3" text-anchor="middle" fill="#fda4af" font-size="10" font-weight="700">📦 PAYLOADS</text>
        <text x="0" y="9" text-anchor="middle" fill="#94a3b8" font-size="8">Fake APKs • Malicious QR</text>
      </g>
    </g>
    <!-- Label Tag -->
    <rect x="50" y="90" width="130" height="24" rx="6" fill="#1e1e2e" stroke="#f43f5e" stroke-width="1"/>
    <text x="115" y="106" text-anchor="middle" fill="#fda4af" font-size="9" font-weight="700">LAYER 1: ATTACK SURFACE</text>
  </g>

  <!-- ========================================== -->
  <!-- LAYER 2: SATARKPAY ON-DEVICE CORE (MIDDLE ISOMETRIC SLAB) -->
  <!-- ========================================== -->
  <g class="iso-layer-mid">
    <!-- Isometric Slab Base -->
    <path d="M 480 210 L 860 270 L 480 330 L 100 270 Z" fill="url(#layer2-grad)" stroke="#06b6d4" stroke-width="2.2" filter="url(#glow-cyan)"/>
    <!-- Slab Extrusion Thickness -->
    <path d="M 100 270 L 100 282 L 480 342 L 480 330 Z" fill="#0e7490" opacity="0.6"/>
    <path d="M 480 330 L 480 342 L 860 282 L 860 270 Z" fill="#155e75" opacity="0.8"/>

    <!-- Center 3D Engine Hologram -->
    <g transform="translate(480, 270)">
      <!-- Outer Hexagon Engine -->
      <polygon points="0,-36 36,-18 36,18 0,36 -36,18 -36,-18" fill="#0f172a" stroke="#00f2fe" stroke-width="2" filter="url(#glow-cyan)"/>
      <circle cx="0" cy="0" r="14" fill="#0284c7" opacity="0.6"/>
      <text x="0" y="-3" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="900">🛡️ CORE</text>
      <text x="0" y="11" text-anchor="middle" fill="#67e8f9" font-size="8.5" font-weight="700">&lt;12ms</text>
    </g>

    <!-- Node Left: Screenshot Radar OCR -->
    <g transform="translate(240, 268)">
      <ellipse cx="0" cy="0" rx="38" ry="19" fill="#0f172a" stroke="#06b6d4" stroke-width="1.2"/>
      <text x="0" y="-3" text-anchor="middle" fill="#a5f3fc" font-size="9.5" font-weight="700">📸 RADAR OCR</text>
      <text x="0" y="9" text-anchor="middle" fill="#94a3b8" font-size="8">Fake Receipt Intercept</text>
    </g>

    <!-- Node Right: 38 Deterministic Rules & SEBI Registry -->
    <g transform="translate(720, 268)">
      <ellipse cx="0" cy="0" rx="42" ry="19" fill="#0f172a" stroke="#06b6d4" stroke-width="1.2"/>
      <text x="0" y="-3" text-anchor="middle" fill="#a5f3fc" font-size="9.5" font-weight="700">⚡ 38 THREAT RULES</text>
      <text x="0" y="9" text-anchor="middle" fill="#94a3b8" font-size="8">SEBI Registry • Dwell Gate</text>
    </g>

    <!-- Label Tag -->
    <rect x="50" y="225" width="145" height="24" rx="6" fill="#082f49" stroke="#06b6d4" stroke-width="1"/>
    <text x="122" y="241" text-anchor="middle" fill="#38bdf8" font-size="9" font-weight="700">LAYER 2: ON-DEVICE SHIELD</text>
  </g>

  <!-- ========================================== -->
  <!-- LAYER 3: UPI APPS & GOLDEN HOUR ENGINE (BOTTOM ISOMETRIC SLAB) -->
  <!-- ========================================== -->
  <g class="iso-layer-bot">
    <!-- Isometric Slab Base -->
    <path d="M 480 345 L 820 400 L 480 455 L 140 400 Z" fill="url(#layer3-grad)" stroke="#10b981" stroke-width="1.8" filter="url(#glow-green)"/>
    <!-- Slab Extrusion Thickness -->
    <path d="M 140 400 L 140 410 L 480 465 L 480 455 Z" fill="#065f46" opacity="0.6"/>
    <path d="M 480 455 L 480 465 L 820 410 L 820 400 Z" fill="#047857" opacity="0.8"/>

    <!-- Left Node: Protected UPI Apps -->
    <g transform="translate(260, 400)">
      <ellipse cx="0" cy="0" rx="40" ry="19" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
      <text x="0" y="-3" text-anchor="middle" fill="#a7f3d0" font-size="9.5" font-weight="700">✅ SAFE TRANSACTION</text>
      <text x="0" y="9" text-anchor="middle" fill="#6ee7b7" font-size="8">GPay • PhonePe • Paytm</text>
    </g>

    <!-- Center Node: AI Sanchalak Friction Ladder -->
    <g transform="translate(480, 405)">
      <ellipse cx="0" cy="0" rx="45" ry="20" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
      <text x="0" y="-3" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="800">🧭 AI SANCHALAK</text>
      <text x="0" y="10" text-anchor="middle" fill="#a7f3d0" font-size="8.5">Vernacular Audio Friction</text>
    </g>

    <!-- Right Node: Golden Hour Post-Fraud Recovery -->
    <g transform="translate(700, 400)">
      <ellipse cx="0" cy="0" rx="40" ry="19" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
      <text x="0" y="-3" text-anchor="middle" fill="#a7f3d0" font-size="9.5" font-weight="700">🚨 CFCFRMS 1930</text>
      <text x="0" y="9" text-anchor="middle" fill="#6ee7b7" font-size="8">Instant Cyber-Cell Dossier</text>
    </g>

    <!-- Label Tag -->
    <rect x="50" y="360" width="145" height="24" rx="6" fill="#022c22" stroke="#10b981" stroke-width="1"/>
    <text x="122" y="376" text-anchor="middle" fill="#34d399" font-size="9" font-weight="700">LAYER 3: EXECUTION &amp; RECOVERY</text>
  </g>

  <!-- Bottom Metric Badges -->
  <g transform="translate(480, 470)">
    <text x="0" y="0" text-anchor="middle" fill="#64748b" font-size="9" font-weight="500">100% Client-Side Evaluation • Zero Cloud Plaintext Leakage • DPDP Act 2023 Conforming</text>
  </g>
</svg>
