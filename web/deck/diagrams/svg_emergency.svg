<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620"><rect width="1180" height="620" fill="#0B1220"/><style>text{font-family:'DejaVu Sans', 'Noto Sans', system-ui, sans-serif;} .t{fill:#E8EEF9} .d{fill:#9FB0CC} .a{fill:#4CC9F0} .k{fill:#3DDC97} .w{fill:#FFC857} .r{fill:#FF6B6B}</style><text x="26" y="40" class="t" font-size="22" font-weight="bold">R38 · Fraud confirm → 3 kadam (golden hour)</text><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9FB0CC"/></marker><marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4CC9F0"/></marker></defs><rect x="30" y="110" width="230" height="120" rx="12" fill="#16223a" stroke="#FF6B6B" stroke-width="1.6"/><text x="44" y="136" fill="#E8EEF9" font-size="15" font-weight="bold">User: “CONFIRM hai”</text><text x="44" y="158" class="d" font-size="11.5">koi auto-detect nahi —</text><text x="44" y="175" class="d" font-size="11.5">user khud confirm karta hai</text><line x1="260" y1="170" x2="310" y2="170" stroke="#FF6B6B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="314" y="100" width="210" height="140" rx="12" fill="#121C31" stroke="#FFC857" stroke-width="1.6"/><text x="328" y="126" fill="#E8EEF9" font-size="15" font-weight="bold">M7 pack ready</text><text x="328" y="148" class="d" font-size="11.5">crop + redact + hash</text><text x="328" y="165" class="d" font-size="11.5">annexure + txn/UTR</text><line x1="524" y1="170" x2="574" y2="170" stroke="#FFC857" stroke-width="1.8" marker-end="url(#ah)"/><rect x="578" y="90" width="250" height="160" rx="12" fill="#121C31" stroke="#4CC9F0" stroke-width="1.6"/><text x="592" y="116" fill="#E8EEF9" font-size="15" font-weight="bold">1 · 📧 Email (1 tap)</text><text x="592" y="138" class="d" font-size="11.5">cyber cell 3 IDs + bank nodal cc</text><text x="592" y="155" class="d" font-size="11.5">subject/body ready (txn, UTR, ₹, annexure)</text><text x="592" y="172" class="d" font-size="11.5">auto-send NAHI — aapka mail app khulta hai</text><rect x="578" y="270" width="250" height="160" rx="12" fill="#121C31" stroke="#4CC9F0" stroke-width="1.6"/><text x="592" y="296" fill="#E8EEF9" font-size="15" font-weight="bold">2 · 📞 Helpline call</text><text x="592" y="318" class="d" font-size="11.5">1930 · 1909 · bank/PSP · Bihar cyber cell</text><text x="592" y="335" class="d" font-size="11.5">5-line call script screen par</text><text x="592" y="352" class="d" font-size="11.5">golden hour me freeze request isi call par</text><rect x="578" y="450" width="250" height="140" rx="12" fill="#121C31" stroke="#4CC9F0" stroke-width="1.6"/><text x="592" y="476" fill="#E8EEF9" font-size="15" font-weight="bold">3 · ⛔ Payment stop</text><text x="592" y="498" class="d" font-size="11.5">txn dispute/chargeback</text><text x="592" y="515" class="d" font-size="11.5">beneficiary par hold (CFCFRMS)</text><text x="592" y="532" class="d" font-size="11.5">account freeze/limit + mandate revoke</text><line x1="828" y1="170" x2="878" y2="170" stroke="#FF6B6B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="882" y="90" width="270" height="500" rx="12" fill="#16223a" stroke="#3DDC97" stroke-width="1.6"/><text x="896" y="116" fill="#E8EEF9" font-size="15" font-weight="bold">Nateeja (target)</text><text x="896" y="138" class="d" font-size="11.5">· complaint number same din</text><text x="896" y="155" class="d" font-size="11.5">· freeze request 10–60 min ke andar</text><text x="896" y="172" class="d" font-size="11.5"></text><text x="896" y="189" class="d" font-size="11.5">· evidence chain-of-custody (SHA-256)</text><text x="896" y="206" class="d" font-size="11.5">· agla victim nahi: family/community</text><text x="896" y="223" class="d" font-size="11.5">  alert (optional step 4)</text><text x="896" y="240" class="d" font-size="11.5"></text><text x="896" y="257" class="d" font-size="11.5">· NCRP + SCORES / SMART ODR follow-up</text><text x="896" y="274" class="d" font-size="11.5">  (investment angle ho to)</text><text x="896" y="291" class="d" font-size="11.5"></text><text x="896" y="308" class="d" font-size="11.5">Honest: recovery guarantee nahi —</text><text x="896" y="325" class="d" font-size="11.5">humein sirf time-optimised steps dete hain.</text><text x="30" y="300" class="d" font-size="12">Golden-hour clock user ke confirm karne ke waqt se chalta hai — demo me live dikhta hai.</text><text x="30" y="324" class="d" font-size="12">Email/call/stop — teeno user ke tap par; app khud nahi bhejti/call karti (privacy).</text></svg>