<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640"><rect width="1240" height="640" fill="#FFFBF4"/><style>text{font-family:'DejaVu Sans', 'Noto Sans', system-ui, sans-serif;} .t{fill:#1E2A44} .d{fill:#6B7A93} .a{fill:#FF7A1A} .k{fill:#1E9E63} .w{fill:#F5B301} .r{fill:#E23B3B} .i{fill:#3B5BDB} .te{fill:#0E9F8F}</style><text x="28" y="38" class="t" font-size="21" font-weight="bold">R38 · Fraud CONFIRM → turant 3 kadam (golden hour)</text><rect x="28" y="48" width="88" height="5" rx="2.5" fill="#FF7A1A"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FF7A1A"/></marker></defs><rect x="28" y="110" width="230" height="130" rx="12" fill="#FFF6EA" stroke="#E23B3B" stroke-width="1.6"/><rect x="28" y="110" width="230" height="30" rx="12" fill="#E23B3B"/><rect x="28" y="130" width="230" height="10" fill="#E23B3B"/><text x="42" y="131" fill="#FFFFFF" font-size="14.5" font-weight="bold">User: “CONFIRM hai”</text><text x="42" y="186.0" class="d" font-size="11.5">koi auto-detect nahi —</text><text x="42" y="203.5" class="d" font-size="11.5">user khud confirm karta hai</text><line x1="258" y1="175" x2="292" y2="175" stroke="#FF7A1A" stroke-width="2.2" marker-end="url(#ah)"/><rect x="294" y="110" width="230" height="130" rx="12" fill="#FFFFFF" stroke="#F5B301" stroke-width="1.6"/><rect x="294" y="110" width="230" height="30" rx="12" fill="#F5B301"/><rect x="294" y="130" width="230" height="10" fill="#F5B301"/><text x="308" y="131" fill="#FFFFFF" font-size="14.5" font-weight="bold">M7 pack ready</text><text x="308" y="186.0" class="d" font-size="11.5">crop + redact + hash</text><text x="308" y="203.5" class="d" font-size="11.5">annexure + txn/UTR</text><line x1="524" y1="175" x2="558" y2="175" stroke="#FF7A1A" stroke-width="2.2" marker-end="url(#ah)"/><rect x="560" y="84" width="340" height="132.5" rx="12" fill="#FFFFFF" stroke="#0E9F8F" stroke-width="1.6"/><rect x="560" y="84" width="340" height="30" rx="12" fill="#0E9F8F"/><rect x="560" y="104" width="340" height="10" fill="#0E9F8F"/><text x="574" y="105" fill="#FFFFFF" font-size="14.5" font-weight="bold">1 · 📧 Email (1 tap)</text><text x="574" y="160.0" class="d" font-size="11.5">cyber cell 3 IDs + bank nodal cc</text><text x="574" y="177.5" class="d" font-size="11.5">subject/body ready (txn, UTR, ₹, annexure)</text><text x="574" y="195.0" class="d" font-size="11.5">auto-send NAHI — aapka mail app khulta hai</text><rect x="560" y="222" width="340" height="132.5" rx="12" fill="#FFFFFF" stroke="#0E9F8F" stroke-width="1.6"/><rect x="560" y="222" width="340" height="30" rx="12" fill="#0E9F8F"/><rect x="560" y="242" width="340" height="10" fill="#0E9F8F"/><text x="574" y="243" fill="#FFFFFF" font-size="14.5" font-weight="bold">2 · 📞 Helpline call</text><text x="574" y="298.0" class="d" font-size="11.5">1930 · 1909 · bank/PSP · Bihar cyber cell</text><text x="574" y="315.5" class="d" font-size="11.5">5-line call script screen par</text><text x="574" y="333.0" class="d" font-size="11.5">freeze request isi call par jaati hai</text><rect x="560" y="360" width="340" height="132.5" rx="12" fill="#FFFFFF" stroke="#0E9F8F" stroke-width="1.6"/><rect x="560" y="360" width="340" height="30" rx="12" fill="#0E9F8F"/><rect x="560" y="380" width="340" height="10" fill="#0E9F8F"/><text x="574" y="381" fill="#FFFFFF" font-size="14.5" font-weight="bold">3 · ⛔ Payment stop</text><text x="574" y="436.0" class="d" font-size="11.5">txn dispute/chargeback</text><text x="574" y="453.5" class="d" font-size="11.5">beneficiary par hold (CFCFRMS)</text><text x="574" y="471.0" class="d" font-size="11.5">account freeze + mandate revoke</text><rect x="560" y="498" width="340" height="115.0" rx="12" fill="#FFFFFF" stroke="#3B5BDB" stroke-width="1.6"/><rect x="560" y="498" width="340" height="30" rx="12" fill="#3B5BDB"/><rect x="560" y="518" width="340" height="10" fill="#3B5BDB"/><text x="574" y="519" fill="#FFFFFF" font-size="14.5" font-weight="bold">4 · 👨‍👩‍👧 Parivaar alert (optional)</text><text x="574" y="574.0" class="d" font-size="11.5">masked numbers ke saath warning</text><text x="574" y="591.5" class="d" font-size="11.5">taaki agla victim na bane</text><line x1="900" y1="175" x2="934" y2="175" stroke="#FF7A1A" stroke-width="2.2" marker-end="url(#ah)"/><rect x="936" y="84" width="276" height="524" rx="12" fill="#FFF6EA" stroke="#1E9E63" stroke-width="1.6"/><rect x="936" y="84" width="276" height="30" rx="12" fill="#1E9E63"/><rect x="936" y="104" width="276" height="10" fill="#1E9E63"/><text x="950" y="105" fill="#FFFFFF" font-size="14.5" font-weight="bold">Nateeja (target)</text><text x="950" y="160.0" class="d" font-size="11.5">· complaint number same din</text><text x="950" y="177.5" class="d" font-size="11.5">· freeze request 10–60 min me</text><text x="950" y="195.0" class="d" font-size="11.5"></text><text x="950" y="212.5" class="d" font-size="11.5">· chain-of-custody (SHA-256)</text><text x="950" y="230.0" class="d" font-size="11.5">· agla victim nahi (alert)</text><text x="950" y="247.5" class="d" font-size="11.5"></text><text x="950" y="265.0" class="d" font-size="11.5">· NCRP + SCORES / SMART ODR</text><text x="950" y="282.5" class="d" font-size="11.5">  follow-up</text><text x="950" y="300.0" class="d" font-size="11.5"></text><text x="950" y="317.5" class="d" font-size="11.5">Honest: recovery ki guarantee</text><text x="950" y="335.0" class="d" font-size="11.5">nahi — hum sirf time-optimised</text><text x="950" y="352.5" class="d" font-size="11.5">steps dete hain.</text></svg>