<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="720" viewBox="0 0 1420 720"><rect width="1420" height="720" fill="#0B1220"/><style>text{font-family:'DejaVu Sans', 'Noto Sans', system-ui, sans-serif;} .t{fill:#E8EEF9} .d{fill:#9FB0CC} .a{fill:#4CC9F0} .k{fill:#3DDC97} .w{fill:#FFC857} .r{fill:#FF6B6B}</style><text x="26" y="40" class="t" font-size="22" font-weight="bold">SatarkPay — chat se payment tak, aur fraud ke baad: 7 modules + R38</text><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9FB0CC"/></marker><marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4CC9F0"/></marker></defs><text x="26" y="80" class="d" font-size="12">LANE 1 · PRE-PAYMENT (interception — 100% real-time on-device)</text><text x="26" y="330" class="d" font-size="12">LANE 2 · SAATH-SAATH CHALNE WALE SHIELDS (parallel guards)</text><text x="26" y="555" class="d" font-size="12">LANE 3 · FRAUD KE BAAD (evidence + turant action)</text><rect x="30" y="100" width="170" height="96" rx="12" fill="#121C31" stroke="#3b4a67" stroke-width="1.6"/><text x="44" y="126" fill="#E8EEF9" font-size="15" font-weight="bold">WhatsApp / Telegram</text><text x="44" y="148" class="d" font-size="11.5">chat (naya ya purana</text><text x="44" y="165" class="d" font-size="11.5">contact · group)</text><line x1="200" y1="148" x2="236" y2="148" stroke="#4CC9F0" stroke-width="1.8" marker-end="url(#ah)"/><rect x="240" y="100" width="170" height="96" rx="12" fill="#121C31" stroke="#3b4a67" stroke-width="1.6"/><text x="254" y="126" fill="#E8EEF9" font-size="15" font-weight="bold">Chat session timer</text><text x="254" y="148" class="d" font-size="11.5">UsageStats dwell</text><text x="254" y="165" class="d" font-size="11.5">(foreground, on-device)</text><line x1="410" y1="148" x2="446" y2="148" stroke="#4CC9F0" stroke-width="1.8" marker-end="url(#ah)"/><rect x="450" y="100" width="170" height="96" rx="12" fill="#121C31" stroke="#3b4a67" stroke-width="1.6"/><text x="464" y="126" fill="#E8EEF9" font-size="15" font-weight="bold">UPI app khula</text><text x="464" y="148" class="d" font-size="11.5">payment screen / intent</text><text x="464" y="165" class="d" font-size="11.5">≤5 min gap</text><line x1="620" y1="148" x2="656" y2="148" stroke="#4CC9F0" stroke-width="1.8" marker-end="url(#ah)"/><rect x="660" y="100" width="250" height="96" rx="12" fill="#16223a" stroke="#4CC9F0" stroke-width="1.6"/><text x="674" y="126" fill="#E8EEF9" font-size="15" font-weight="bold">M1 · Chat-Before-Pay Gate</text><text x="674" y="148" class="d" font-size="11.5">contact × session-length matrix</text><text x="674" y="165" class="d" font-size="11.5">4 cells → T1 / T2 / T3</text><line x1="910" y1="148" x2="946" y2="148" stroke="#4CC9F0" stroke-width="1.8" marker-end="url(#ah)"/><rect x="950" y="66" width="360" height="74" rx="12" fill="#121C31" stroke="#3DDC97" stroke-width="1.6"/><text x="964" y="92" fill="#E8EEF9" font-size="15" font-weight="bold">T1 · FAST PATH (saved + chhoti chat)</text><text x="964" y="114" class="d" font-size="11.5">1 min check · ya 1-tap call-confirm → pay</text><rect x="950" y="146" width="360" height="74" rx="12" fill="#121C31" stroke="#FFC857" stroke-width="1.6"/><text x="964" y="172" fill="#E8EEF9" font-size="15" font-weight="bold">T2 · COOLING (unknown + chhoti chat)</text><text x="964" y="194" class="d" font-size="11.5">8 min guided: chat dobara padho + 3 sawal</text><rect x="950" y="226" width="360" height="74" rx="12" fill="#121C31" stroke="#FF6B6B" stroke-width="1.6"/><text x="964" y="252" fill="#E8EEF9" font-size="15" font-weight="bold">T3 · HOLD (unknown + lambi chat / officer)</text><text x="964" y="274" class="d" font-size="11.5">analyst callback ≤5 min · rule R1 attach</text><rect x="30" y="350" width="240" height="150" rx="12" fill="#121C31" stroke="#4CC9F0" stroke-width="1.6"/><text x="44" y="376" fill="#E8EEF9" font-size="15" font-weight="bold">M2 · Screenshot Radar</text><text x="44" y="398" class="d" font-size="11.5">payment screenshot ka burst</text><text x="44" y="415" class="d" font-size="11.5">30 min me 3+ → amber, 5+ → red</text><text x="44" y="432" class="d" font-size="11.5">R22: same payee 3rd txn → cooling</text><rect x="282" y="350" width="240" height="150" rx="12" fill="#121C31" stroke="#4CC9F0" stroke-width="1.6"/><text x="296" y="376" fill="#E8EEF9" font-size="15" font-weight="bold">M3 · Domain Trust</text><text x="296" y="398" class="d" font-size="11.5">L1 verified … L4 fake lookalike</text><text x="296" y="415" class="d" font-size="11.5">gateway achha ≠ merchant achha</text><text x="296" y="432" class="d" font-size="11.5">R26: SEBI/NSDL registry check</text><rect x="534" y="350" width="240" height="150" rx="12" fill="#121C31" stroke="#4CC9F0" stroke-width="1.6"/><text x="548" y="376" fill="#E8EEF9" font-size="15" font-weight="bold">M4 · AI Sanchalak</text><text x="548" y="398" class="d" font-size="11.5">paste karo → verdict + 3 reasons</text><text x="548" y="415" class="d" font-size="11.5">R27 negation · R28 redaction</text><text x="548" y="432" class="d" font-size="11.5">Hindi voice · senior mode · R37 eval</text><rect x="786" y="350" width="240" height="150" rx="12" fill="#121C31" stroke="#4CC9F0" stroke-width="1.6"/><text x="800" y="376" fill="#E8EEF9" font-size="15" font-weight="bold">M5 · Wallet / AutoPay</text><text x="800" y="398" class="d" font-size="11.5">connected apps + mandates</text><text x="800" y="415" class="d" font-size="11.5">daily/unknown mandate = red</text><text x="800" y="432" class="d" font-size="11.5">one-tap revoke</text><rect x="1038" y="350" width="242" height="150" rx="12" fill="#121C31" stroke="#4CC9F0" stroke-width="1.6"/><text x="1052" y="376" fill="#E8EEF9" font-size="15" font-weight="bold">M6 · Intel Desk (live)</text><text x="1052" y="398" class="d" font-size="11.5">crawler: naye scam patterns</text><text x="1052" y="415" class="d" font-size="11.5">analyst 15-sec review queue</text><text x="1052" y="432" class="d" font-size="11.5">registry push → app OTA</text><rect x="30" y="575" width="250" height="120" rx="12" fill="#121C31" stroke="#FFC857" stroke-width="1.6"/><text x="44" y="601" fill="#E8EEF9" font-size="15" font-weight="bold">M7 · Auto-Report</text><text x="44" y="623" class="d" font-size="11.5">crop · OCR · QR · redact · hash</text><text x="44" y="640" class="d" font-size="11.5">NCRP text (HI/EN) + annexure + ZIP</text><line x1="280" y1="635" x2="320" y2="635" stroke="#FFC857" stroke-width="1.8" marker-end="url(#ah)"/><rect x="324" y="575" width="300" height="120" rx="12" fill="#16223a" stroke="#FF6B6B" stroke-width="1.6"/><text x="338" y="601" fill="#E8EEF9" font-size="15" font-weight="bold">R38 · Fraud CONFIRM</text><text x="338" y="623" class="d" font-size="11.5">📧 cyber-cell + bank email draft</text><text x="338" y="640" class="d" font-size="11.5">📞 1930 / bank dialer + call script</text><text x="338" y="657" class="d" font-size="11.5">⛔ payment-stop request (CFCFRMS)</text><line x1="624" y1="635" x2="664" y2="635" stroke="#FF6B6B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="668" y="575" width="250" height="120" rx="12" fill="#121C31" stroke="#FF6B6B" stroke-width="1.6"/><text x="682" y="601" fill="#E8EEF9" font-size="15" font-weight="bold">Helpline + bank</text><text x="682" y="623" class="d" font-size="11.5">1930 golden hour · freeze</text><text x="682" y="640" class="d" font-size="11.5">dispute/chargeback · UTR</text><line x1="918" y1="635" x2="958" y2="635" stroke="#FFC857" stroke-width="1.8" marker-end="url(#ah)"/><rect x="962" y="575" width="380" height="120" rx="12" fill="#121C31" stroke="#FFC857" stroke-width="1.6"/><text x="976" y="601" fill="#E8EEF9" font-size="15" font-weight="bold">SCORES · SMART ODR · Sanchar Saathi</text><text x="976" y="623" class="d" font-size="11.5">investment angle → SEBI SCORES</text><text x="976" y="640" class="d" font-size="11.5">number/SMS → Sanchar Saathi</text><text x="976" y="657" class="d" font-size="11.5">optional: parivaar ko alert</text><line x1="1150" y1="567" x2="1180" y2="502" stroke="#4CC9F0" stroke-width="1.8" stroke-dasharray="6 6" marker-end="url(#ah)"/><text x="1132" y="538" class="a" font-size="11">naya pattern → Intel Desk</text></svg>