<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="640" viewBox="0 0 1250 640"><rect width="1250" height="640" fill="#0B1220"/><style>text{font-family:'DejaVu Sans', 'Noto Sans', system-ui, sans-serif;} .t{fill:#E8EEF9} .d{fill:#9FB0CC} .a{fill:#4CC9F0} .k{fill:#3DDC97} .w{fill:#FFC857} .r{fill:#FF6B6B}</style><text x="26" y="40" class="t" font-size="22" font-weight="bold">M1 · Chat-Before-Pay matrix — 4 cells, koi auto-block nahi</text><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9FB0CC"/></marker><marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4CC9F0"/></marker></defs><text x="542" y="134" class="d" font-size="13" text-anchor="middle">chhoti chat (&lt; 8 min)</text><text x="986" y="134" class="d" font-size="13" text-anchor="middle">lambi chat (≥ 8–10 min)</text><text x="306" y="247" class="d" font-size="13" text-anchor="end">SAVED contact</text><text x="306" y="432" class="d" font-size="13" text-anchor="end">UNKNOWN number</text><rect x="320" y="150" width="444" height="185" rx="12" fill="#121C31" stroke="#3DDC97" stroke-width="1.6"/><text x="334" y="176" fill="#E8EEF9" font-size="15" font-weight="bold">T1 · FAST PATH</text><text x="334" y="198" class="d" font-size="11.5">“Saved contact — 1 min check, phir pay”</text><text x="334" y="215" class="d" font-size="11.5">ya 1-tap: saved number par call-confirm → allow</text><text x="334" y="232" class="d" font-size="11.5"></text><text x="334" y="249" class="d" font-size="11.5">User ke paas: Direct pay · Call-confirm · Cancel</text><rect x="764" y="150" width="444" height="185" rx="12" fill="#121C31" stroke="#FFC857" stroke-width="1.6"/><text x="778" y="176" fill="#E8EEF9" font-size="15" font-weight="bold">T1 · NOTIFICATION (3 min)</text><text x="778" y="198" class="d" font-size="11.5">“10+ min chat ke baad payment app khula hai —</text><text x="778" y="215" class="d" font-size="11.5">kya koi aapko paisa bhejne ko keh raha hai?”</text><text x="778" y="232" class="d" font-size="11.5"></text><text x="778" y="249" class="d" font-size="11.5">saved number par bhi — account hack + pressure</text><rect x="320" y="335" width="444" height="185" rx="12" fill="#121C31" stroke="#FFC857" stroke-width="1.6"/><text x="334" y="361" fill="#E8EEF9" font-size="15" font-weight="bold">T2 · COOLING (8 min)</text><text x="334" y="383" class="d" font-size="11.5">Unknown ko samajhne me time lagta hai:</text><text x="334" y="400" class="d" font-size="11.5">chat dobara padho + 3 sawal</text><text x="334" y="417" class="d" font-size="11.5"></text><text x="334" y="434" class="d" font-size="11.5">Q1: khud bhej rahe ho (kisi ne nahi kaha)?</text><text x="334" y="451" class="d" font-size="11.5">Q2: kisi officer/offer ne kaha?  Q3: live call?</text><rect x="764" y="335" width="444" height="185" rx="12" fill="#16223a" stroke="#FF6B6B" stroke-width="1.6"/><text x="778" y="361" fill="#E8EEF9" font-size="15" font-weight="bold">T3 · HOLD + CALLBACK</text><text x="778" y="383" class="d" font-size="11.5">unknown + lambi chat + turant payment</text><text x="778" y="400" class="d" font-size="11.5">= digital-arrest / task-script ka classic shape</text><text x="778" y="417" class="d" font-size="11.5"></text><text x="778" y="434" class="d" font-size="11.5">analyst callback ≤5 min · rule R1 attach</text><rect x="22" y="150" width="286" height="185" rx="12" fill="#121C31" stroke="#3b4a67" stroke-width="1.6"/><text x="36" y="176" fill="#E8EEF9" font-size="15" font-weight="bold">Timer kaise chalta hai</text><text x="36" y="198" class="d" font-size="11">· sirf foreground dwell (chat screen)</text><text x="36" y="215" class="d" font-size="11">· app chhod ke 5 s me wapas = credit nahi</text><text x="36" y="232" class="d" font-size="11">· fast path bhi 24h me ek baar (per-payee)</text><text x="36" y="249" class="d" font-size="11">· “It&#x27;s me” se notification nahi khulta</text><rect x="22" y="355" width="286" height="230" rx="12" fill="#121C31" stroke="#4CC9F0" stroke-width="1.6"/><text x="36" y="381" fill="#E8EEF9" font-size="15" font-weight="bold">Kya naya hai (100% real-time on-device)</text><text x="36" y="403" class="d" font-size="11">Traditional tools sirf post-scam check karte</text><text x="36" y="420" class="d" font-size="11">hain — yaani fraud ho jaane ke BAAD.</text><text x="36" y="437" class="d" font-size="11"></text><text x="36" y="454" class="d" font-size="11">SatarkPay payment se PEHLE intercept</text><text x="36" y="471" class="d" font-size="11">karta hai: app-switch + chat-length +</text><text x="36" y="488" class="d" font-size="11">contact-tier — sab on-device.</text><text x="36" y="505" class="d" font-size="11"></text><text x="36" y="522" class="d" font-size="11">Block kuch nahi hota: payment rukta hai,</text><text x="36" y="539" class="d" font-size="11">final call user ki.</text></svg>