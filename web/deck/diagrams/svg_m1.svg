<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640"><rect width="1240" height="640" fill="#FFFBF4"/><style>text{font-family:'DejaVu Sans', 'Noto Sans', system-ui, sans-serif;} .t{fill:#1E2A44} .d{fill:#6B7A93} .a{fill:#FF7A1A} .k{fill:#1E9E63} .w{fill:#F5B301} .r{fill:#E23B3B} .i{fill:#3B5BDB} .te{fill:#0E9F8F}</style><text x="28" y="38" class="t" font-size="21" font-weight="bold">M1 · Chat-Before-Pay matrix — 4 cells, koi auto-block nahi</text><rect x="28" y="48" width="88" height="5" rx="2.5" fill="#FF7A1A"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FF7A1A"/></marker></defs><text x="538" y="130" class="d" font-size="13" text-anchor="middle">chhoti chat (&lt; 8 min)</text><text x="978" y="130" class="d" font-size="13" text-anchor="middle">lambi chat (≥ 8–10 min)</text><text x="304" y="248" class="t" font-size="13" text-anchor="end" font-weight="bold">SAVED contact</text><text x="304" y="438" class="t" font-size="13" text-anchor="end" font-weight="bold">UNKNOWN number</text><rect x="318" y="148" width="440" height="190" rx="12" fill="#FFFFFF" stroke="#1E9E63" stroke-width="1.6"/><rect x="318" y="148" width="440" height="30" rx="12" fill="#1E9E63"/><rect x="318" y="168" width="440" height="10" fill="#1E9E63"/><text x="332" y="169" fill="#FFFFFF" font-size="14.5" font-weight="bold">T1 · FAST PATH</text><text x="332" y="224.0" class="d" font-size="11.5">“Saved contact — 1 min check, phir pay”</text><text x="332" y="241.5" class="d" font-size="11.5">ya 1-tap: saved number par call-confirm → allow</text><text x="332" y="259.0" class="d" font-size="11.5"></text><text x="332" y="276.5" class="d" font-size="11.5">User ke paas: Direct pay · Call-confirm · Cancel</text><rect x="758" y="148" width="440" height="190" rx="12" fill="#FFFFFF" stroke="#F5B301" stroke-width="1.6"/><rect x="758" y="148" width="440" height="30" rx="12" fill="#F5B301"/><rect x="758" y="168" width="440" height="10" fill="#F5B301"/><text x="772" y="169" fill="#FFFFFF" font-size="14.5" font-weight="bold">T1 · NOTIFICATION (3 min)</text><text x="772" y="224.0" class="d" font-size="11.5">“10+ min chat ke baad payment app khula hai —</text><text x="772" y="241.5" class="d" font-size="11.5">kya koi aapko paisa bhejne ko keh raha hai?”</text><text x="772" y="259.0" class="d" font-size="11.5"></text><text x="772" y="276.5" class="d" font-size="11.5">saved number par bhi — account hack + pressure</text><rect x="318" y="338" width="440" height="190" rx="12" fill="#FFFFFF" stroke="#F5B301" stroke-width="1.6"/><rect x="318" y="338" width="440" height="30" rx="12" fill="#F5B301"/><rect x="318" y="358" width="440" height="10" fill="#F5B301"/><text x="332" y="359" fill="#FFFFFF" font-size="14.5" font-weight="bold">T2 · COOLING (8 min)</text><text x="332" y="414.0" class="d" font-size="11.5">Unknown ko samajhne me time lagta hai:</text><text x="332" y="431.5" class="d" font-size="11.5">chat dobara padho + 3 sawal</text><text x="332" y="449.0" class="d" font-size="11.5"></text><text x="332" y="466.5" class="d" font-size="11.5">Q1: khud bhej rahe ho?  Q2: kisi officer ne kaha?</text><text x="332" y="484.0" class="d" font-size="11.5">Q3: live call/chat chal rahi hai?</text><rect x="758" y="338" width="440" height="190" rx="12" fill="#FFF6EA" stroke="#E23B3B" stroke-width="1.6"/><rect x="758" y="338" width="440" height="30" rx="12" fill="#E23B3B"/><rect x="758" y="358" width="440" height="10" fill="#E23B3B"/><text x="772" y="359" fill="#FFFFFF" font-size="14.5" font-weight="bold">T3 · HOLD + CALLBACK</text><text x="772" y="414.0" class="d" font-size="11.5">unknown + lambi chat + turant payment</text><text x="772" y="431.5" class="d" font-size="11.5">= digital-arrest / task-script ka classic shape</text><text x="772" y="449.0" class="d" font-size="11.5"></text><text x="772" y="466.5" class="d" font-size="11.5">analyst callback ≤5 min · rule R1 attach</text><rect x="22" y="148" width="280" height="190" rx="12" fill="#FFFFFF" stroke="#EADFD0" stroke-width="1.6"/><text x="36" y="173" fill="#1E2A44" font-size="14.5" font-weight="bold">Timer kaise chalta hai</text><text x="36" y="194.0" class="d" font-size="11">· sirf foreground dwell (chat screen)</text><text x="36" y="211.5" class="d" font-size="11">· app chhod ke 5 s me wapas = credit nahi</text><text x="36" y="229.0" class="d" font-size="11">· fast path bhi 24h me ek baar (per-payee)</text><text x="36" y="246.5" class="d" font-size="11">· “It&#x27;s me” se notification nahi khulta</text><rect x="22" y="358" width="280" height="232" rx="12" fill="#FFF6EA" stroke="#FF7A1A" stroke-width="1.6"/><text x="36" y="383" fill="#1E2A44" font-size="14.5" font-weight="bold">Kya naya hai (peer me 0%)</text><text x="36" y="404.0" class="d" font-size="11">peers 77% “paste msg → score” karte</text><text x="36" y="421.5" class="d" font-size="11">hain — yaani fraud ho jaane ke BAAD.</text><text x="36" y="439.0" class="d" font-size="11"></text><text x="36" y="456.5" class="d" font-size="11">SatarkPay payment se PEHLE intercept</text><text x="36" y="474.0" class="d" font-size="11">karta hai: app-switch + chat-length +</text><text x="36" y="491.5" class="d" font-size="11">contact-tier — sab on-device.</text><text x="36" y="509.0" class="d" font-size="11"></text><text x="36" y="526.5" class="d" font-size="11">Block kuch nahi hota: payment rukta hai,</text><text x="36" y="544.0" class="d" font-size="11">final call user ki.</text></svg>